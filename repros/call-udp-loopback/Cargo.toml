[package]
name = "call-udp-loopback"
version = "0.1.0"
edition = "2021"
publish = false

# Device check for wandr-call's real UDP transport: two PeerSessions over real
# wasi:sockets UDP (loopback) do signaling → ICE → DTLS-SRTP → encrypted Opus,
# in a wasm32-wasip2 guest. Proves the std::net::UdpSocket path (→ wasi:sockets)
# works end-to-end through wandr-host on-device.
#   wandr-host --run-once wandr.probe.calludp

[dependencies]
wandr-call = { path = "../../crates/wandr-call" }
