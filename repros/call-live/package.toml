# call-live — the call-engine capstone: live call (real UDP + DTLS-SRTP) carrying
# real mic audio to the speaker. wasi:cli/command wandrpkg.
# Run: wandr-host --run-once wandr.probe.calllive  (speak during "on the call").
app_id      = "wandr.probe.calllive"
version     = "0.1.0"
world       = "wasi:cli/command"
kind        = "system"
composition = "same-store"

[components]
probe = "components/probe.wasm"
