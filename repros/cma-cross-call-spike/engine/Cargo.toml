[package]
name = "cma-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# 0.53 — same resolution as the real Signal engine tree (0.53.1); the async
# executor/rt must be this version when the engine migrates.
[dependencies]
wit-bindgen = { version = "0.59", features = ["async", "async-spawn"] }
# Phase-3 kill-gate: the real p3 transport backend under test.
wandr-reqwest = { path = "../../../crates/wandr-reqwest", default-features = false, features = ["p3-async"] }
wandr-reqwest-websocket = { path = "../../../crates/wandr-reqwest-websocket", default-features = false, features = ["p3-async"] }
futures = "0.3"
url = "2"

[profile.release]
opt-level = "s"

[workspace]
