[package]
name = "cma-cross-call-spike-host"
version = "0.1.0"
edition = "2021"
publish = false

# Same pins + feature set wandr-host's `p3-async` feature will use (task 115).
[dependencies]
# Released 46.0.1 + wit-bindgen 0.59 GUESTS = ALL GATES PASS (incl. live
# Signal WSS). The stalls/wedges first blamed on wasmtime 46 were wit-bindgen
# 0.53's guest-side async runtime — keep guests on 0.59; no runtime bump needed.
wasmtime          = { version = "=46.0.1", features = ["component-model", "async", "component-model-async"] }
wasmtime-wasi     = { version = "=46.0.1", features = ["p2", "p3"] }
wasmtime-wasi-tls = { version = "=46.0.1", features = ["p2", "p3"] }
tokio             = { version = "1", features = ["rt", "time"] }
anyhow            = "1"
# Production-parity TLS trust store (signal_tls.rs clone): webpki roots + the
# pinned Signal CA, so gate F can reach the real provisioning endpoint.
rustls            = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-rustls      = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots      = "0.26"
rustls-pemfile    = "2"

[workspace]
