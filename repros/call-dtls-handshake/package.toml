# Call engine Stage 2 (DTLS-SRTP handshake) — wasi:cli/command wandrpkg.
# Run: wandr-host --run-once wandr.probe.dtls
app_id      = "wandr.probe.dtls"
version     = "0.1.0"
world       = "wasi:cli/command"
kind        = "system"
composition = "same-store"

[components]
probe = "components/probe.wasm"
