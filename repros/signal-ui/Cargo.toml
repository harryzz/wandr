# signal-ui — task-67 Phase 2 item (2): a dioxus-canvas guest that imports the
# `wart:signal/chat` engine contract and renders a conversation. Composed with
# signal-engine via `wac plug` (item 3). The skiko-gfx backend (WIT + sink + IME
# + renderer wiring) comes from dioxus-canvas's `launch!`; a second `generate!`
# (sharing dioxus-canvas's re-exported wit-bindgen runtime) adds the chat import.
#
#   cargo build --target wasm32-wasip2 --release
[package]
name    = "signal-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dioxus        = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-canvas = { path = "../../crates/dioxus-canvas" }
# QR for the device-link code, drawn in-canvas (no image primitive needed —
# each row is run-length-merged into a few solid divs). default-features off:
# just the matrix, no image output.
qrcode        = { version = "0.14", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true

# dioxus 0.7 + wasm32-wasip2 needs the vendored+patched subsecond (task 60).
[patch.crates-io]
subsecond = { path = "../../external/subsecond" }
