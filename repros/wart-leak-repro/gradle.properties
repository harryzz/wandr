# Kotlin/WASM incremental compilation — caches IR lowering between builds.
# Without this, the WASM linker re-does the whole-world lower from scratch
# every time which takes 1+ hour for a ~30-klib dep graph.
kotlin.incremental.wasm=true
kotlin.incremental.js.ir=true

# Keep the Kotlin compile daemon warm for 2h after build completes so
# subsequent compiles can reuse the loaded IR caches.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
