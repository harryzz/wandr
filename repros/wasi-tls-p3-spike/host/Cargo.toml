[package]
name = "wasi-tls-p3-spike-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasmtime = { version = "46", features = ["component-model", "async", "component-model-async"] }
wasmtime-wasi = { version = "46", features = ["p2", "p3"] }
wasmtime-wasi-tls = { version = "46", features = ["p2", "p3"] }
tokio = { version = "1", features = ["macros", "rt"] }
anyhow = "1"
