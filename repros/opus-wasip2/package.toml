# Opus codec de-risk, packaged as a wasi:cli/command wandrpkg to run through the
# production wandr-host. Run: wandr-host --run-once wandr.probe.opus
app_id      = "wandr.probe.opus"
version     = "0.1.0"
world       = "wasi:cli/command"
kind        = "system"
composition = "same-store"

[components]
probe = "components/probe.wasm"
