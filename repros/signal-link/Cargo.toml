[package]
name = "signal-link"
version = "0.1.0"
edition = "2021"
publish = false

# Task-67 increment 3a: a wasm32-wasip2 guest that opens Signal's provisioning
# websocket (over our wasi:tls transport in the libsignal-service-rs fork) and
# prints the secondary-device link QR. Proves the transport end-to-end against
# real Signal servers + yields a scannable code.

[[bin]]
name = "signal-link"
path = "src/main.rs"

[dependencies]
libsignal-service = { path = "../../external/libsignal-service-rs", default-features = false }
wstd = "0.6.6"
futures = "0.3"
rand = "0.9"
rand_chacha = "0.9"
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"

# libsignal forces its constant-time curve25519 fork; consumers must replicate.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
