# call-audio-wire — wart-call PCM ⇄ real mic/AAudio, wasi:cli/command warpkg.
# Run: wart-host --run-once war.probe.callaudio  (speak, then hear yourself back
# through wart-call's Opus + SRTP pipeline).
app_id      = "war.probe.callaudio"
version     = "0.1.0"
world       = "wasi:cli/command"
kind        = "system"
composition = "same-store"

[components]
probe = "components/probe.wasm"
