# call-audio-wire — wandr-call PCM ⇄ real mic/AAudio, wasi:cli/command wandrpkg.
# Run: wandr-host --run-once wandr.probe.callaudio  (speak, then hear yourself back
# through wandr-call's Opus + SRTP pipeline).
app_id      = "wandr.probe.callaudio"
version     = "0.1.0"
world       = "wasi:cli/command"
kind        = "system"
composition = "same-store"

[components]
probe = "components/probe.wasm"
