# De-risk probe for the desktop camera backend (nokhwa) — task 108 / video roadmap.
# Proves nokhwa opens the WSLg RDP-forwarded /dev/video0 and captures real frames
# BEFORE integrating into runtime/wandr-host's VideoEncoder. Not part of the host
# build. See project_desktop_audio_cpal (the cpal analog) + tasks video roadmap.
[package]
name = "nokhwa-camera-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# input-native = per-OS capture backend (v4l2 Linux / AVFoundation mac / MediaFoundation win).
nokhwa = { version = "0.10", features = ["input-native"] }
image  = "0.25"
# Task 117: was ffmpeg-next 7.1 (which had already drifted from the host's 8.1).
# Now uses the SAME crate the host does, so this probe can no longer test a
# different implementation than the one that ships. No setup needed: wandr-vpx-sys
# compiles the vendored libvpx on first build (`nasm` on PATH is its only
# prerequisite). Just `cargo run --release`.
wandr-video = { path = "../../runtime/wandr-host/crates/wandr-video", features = ["libvpx"] }
