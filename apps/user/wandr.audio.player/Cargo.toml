# wandr.audio.player — task 108 M1: Symphonia decode → wasi:audio PCM, with a
# wasi:canvas waveform/transport UI. Pure-Rust canvas reactor (cdylib), like
# crates/dioxus-canvas guests and the launcher. See docs/audio-player-design.md.
#   cargo build --target wasm32-wasip2 --release
[package]
name    = "wandr-audio-player"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
# Default features = royalty-free codecs/formats (FLAC default-on, no flag, no
# licensing concern — the design's "licensing stays guest-side"). mp3/aac are
# additive feature flags when wanted.
symphonia = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
