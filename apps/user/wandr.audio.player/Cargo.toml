# wandr.audio.player — task 108. Symphonia decode → wasi:audio PCM, now-playing
# via wasi:media-session, UI in Slint (crates/slint-wandr). The audio engine runs
# in the wandr:background/background bg-tick (render-independent), so playback +
# lockscreen control survive backgrounding. See docs/audio-player-design.md.
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/wandr_audio_player.wasm components/ui.wasm
[package]
name    = "wandr-audio-player"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Task 115 — transport flavor. Default = native CM-async (p3): the cover-art /
# metadata fetch rides wandr-reqwest's p3 backend, driven by the host's store
# event loop (no step-executor). `p2-legacy` restores the old step-executor
# reactor. Mutually exclusive; the p3 build needs the p3-async host.
[features]
default = ["p3-async"]
p3-async = ["reqwest/p3-async"]
# ⚠️ OBSOLETE — scheduled for deletion (task 115 cleanup). Rollback-only; delete
# with the optional wandr-step-executor dep, the `wit/` (sync bg-tick) tree, and
# the `#[cfg(feature = "p2-legacy")]` arms in src/lib.rs. See tasks/115.
p2-legacy = ["dep:wandr-step-executor", "reqwest/p2"]

[dependencies]
# UI via Slint over crates/slint-wandr. MUST pin the same git rev as
# crates/slint-wandr's i-slint-core (one crate instance = one platform global);
# the WIT bindings reuse slint_wandr::__wit_bindgen so there is one runtime.
slint = { git = "https://github.com/slint-ui/slint", rev = "46cfde659f21de52bb0fa3693826ca99a6466d88", default-features = false, features = ["compat-1-2", "std"] }
slint-wandr = { path = "../../../crates/slint-wandr" }
# Default features = royalty-free codecs/formats (FLAC/WAV/OGG/Vorbis); `mp3`
# added for the user's library (patents expired 2017 — licensing stays guest-side
# per the design). Streaming decode (incremental, low memory) + a guest-side
# linear resampler to the 48 kHz backend rate.
# default features add FLAC/WAV/OGG-Vorbis; `mp3` + `aac`/`isomp4` add MP3 and
# AAC in M4A/MP4 containers (common in local libraries). Opus is intentionally
# out (Symphonia only demuxes it; no decoder — see docs/audio-player-design.md).
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
# Guest-side cover-art decode (embedded FLAC/ID3 PICTURE → RGBA → Slint Image).
# Pure-Rust jpeg+png only (wasm-ok), no default codecs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Internet metadata/cover-art lookup (Phase A): host-delegated HTTPS via the
# wandr-reqwest-shim over wasi:tls (no guest crypto; network granted by the host).
# The transport backend (p3 native-async vs p2 step-executor) is picked by this
# crate's features (default-features = false; see [features]). JSON via serde_json.
reqwest = { path = "../../../crates/wandr-reqwest", package = "wandr-reqwest", default-features = false }
# step-executor only under p2-legacy (the p3 default drives fetches on the host loop).
wandr-step-executor = { path = "../../../crates/wandr-step-executor", optional = true }
url = "2"
serde_json = "1"
# Spectrum visualizer: 1024-pt FFT of the audible PCM window → log-spaced bands.
# Pure Rust (scalar fallback on wasm), no_std-friendly.
rustfft = "6"

[profile.release]
opt-level = "s"
lto = true
strip = true
