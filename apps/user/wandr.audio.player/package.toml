# wandr.audio.player — task 108 M1. User app (no `kind` → installs under apps/,
# shows as a launcher tile). A wasi:canvas UI reactor that decodes + plays an
# embedded FLAC and renders a waveform + transport. Launched normally (the host
# UI path probes the input-handlers exports); the `world` field is informational.
app_id      = "wandr.audio.player"
version     = "0.1.0"
world       = "my:skiko-gfx/skiko-ui"
composition = "same-store"
orientation = "auto"
label       = "Audio Player"
# Transport animates the seekbar; 30 fps is plenty and halves the cost.
max_fps     = 30

[components]
ui = "components/ui.wasm"
