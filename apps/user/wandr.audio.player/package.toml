# wandr.audio.player — task 108 M1. User app (no `kind` → installs under apps/,
# shows as a launcher tile). A wasi:canvas UI reactor that decodes + plays an
# embedded FLAC and renders a waveform + transport. Launched normally (the host
# UI path probes the input-handlers exports); the `world` field is informational.
app_id      = "wandr.audio.player"
version     = "0.1.0"
world       = "wandr:ui-shell/audio-player"
composition = "same-store"
orientation = "auto"
label       = "Audio Player"
# 60 fps so the now-playing spectrum visualizer paints smoothly; the renderer is
# on-demand (repaints only when something changed), so non-animated screens stay
# cheap regardless of the cap.
max_fps     = 60
# M2 — background-service: the host pumps `bg-tick` while we're backgrounded
# (screen locked) so the audio ring stays fed (no underrun-death) and lockscreen
# transport keeps reaching us. The engine runs in bg-tick; on-frame only renders.
background  = true

[components]
ui = "components/ui.wasm"

# Docker-style host→guest mount: expose the user's music library read-only at
# /music, which the player scans (`/music/<album>/*`). Two per-platform host
# paths for the same guest mount — the host mounts whichever exists on this OS
# and skips the other (desktop has ~/Music, the Android device has the media
# store), so there is no music path hardcoded in wandr-host.
#   `~` → home dir ($HOME, or %USERPROFILE% on Windows).
[[mounts]]
host  = "~/Music"               # desktop (Linux / Windows / macOS)
guest = "/music"
mode  = "ro"

[[mounts]]
host  = "/data/media/0/Music"   # Android device media store
guest = "/music"
mode  = "ro"
