# Arbiter Inc. 3c — alarm test guest. A normal user wandrpkg (no `kind` → installs
# under apps/, lists as a launcher tile + can be foregrounded for the
# alive-deliver test).
app_id      = "wandr.alarm.test"
version     = "0.1.0"
world       = "my:skiko-gfx/skiko-ui"
composition = "same-store"
orientation = "auto"
label       = "Alarm Test"
# M2 — also a background-service: keeps pumping bg-tick while backgrounded.
background  = true

[components]
ui = "components/ui.wasm"
