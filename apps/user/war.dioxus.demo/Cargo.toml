# war.dioxus.demo — the first reactive dioxus guest on wart (task 59).
#
# A flexbox+reactive Rust UI (counter + list + button) rendered through the
# dioxus-canvas "tiny Blitz" renderer over the canvas WIT. No Kotlin/Compose,
# so leak-immune + tiny working set. Proves the dioxus-canvas framework
# end-to-end on device.
#
#   cargo build --target wasm32-wasip2 --release
[package]
name    = "war-dioxus-demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Facade for rsx!/use_signal.
dioxus        = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }
# The renderer + the `launch!` macro. The macro generates the whole wart backend
# (WIT bindings, host-canvas sink, IME/text bridge, renderer wiring) into this
# cdylib, so this guest needs no `.wit` file, no `HostSink`, and — via the
# library's re-exported wit-bindgen — no wit-bindgen dependency. Just dioxus (for
# rsx!) + dioxus-canvas, then `dioxus_canvas::launch!(app)`.
dioxus-canvas = { path = "../../../crates/dioxus-canvas" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# dioxus 0.7 + wasm32-wasip2 requires the vendored+patched subsecond (task 60):
# upstream subsecond pulls wasm-bindgen for any wasm32 target, which doesn't link
# under wasm-component-ld. This [patch] is the build-root for the device artifact.
# See external/subsecond/README.md. Remove once the fix is released upstream.
[patch.crates-io]
subsecond = { path = "../../../external/subsecond" }
