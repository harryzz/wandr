# Task 59 — dioxus demo (user app: no `kind` → installs under apps/, listed
# by the launcher as a tile). Self-contained — no [dependencies].
app_id      = "wandr.dioxus.demo"
version     = "0.1.0"
world       = "wandr:ui-shell/skiko-ui"
composition = "same-store"
orientation = "auto"
label       = "Dioxus Demo"
# Task 64 follow-up — per-app render-rate cap (host-enforced; not in the AOT
# cache-key). A reactive UI doesn't need 60 fps; 30 halves the animating cost.
max_fps     = 30

[components]
ui = "components/ui.wasm"
