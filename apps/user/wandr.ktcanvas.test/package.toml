# wandr.ktcanvas.test — Stage-1 spike of the Kotlin wasi:canvas migration:
# bare Kotlin guest, bindings generated by the JetBrains Kotlin wit-bindgen
# fork, draws exclusively through wasi:canvas (renderer export kept for the
# host's frame driving). See wit/ktcanvas-test.wit + build.sh.
app_id      = "wandr.ktcanvas.test"
version     = "0.1.0"
world       = "wandr:ui-shell/ktcanvas-test"
composition = "same-store"
orientation = "auto"
label       = "KtCanvas"

[components]
ui = "components/ui.wasm"
