# Task 92 — task-manager test guest. A normal user wandrpkg (no `kind` → installs
# under apps/, lists as a launcher tile). A dioxus-canvas GUI that imports
# `wandr:task-manager/task-manager`, polls `list-apps` on a timer, and renders the
# running-app set (label, kind, state, CPU‰, mem) + a kill button per row.
app_id      = "wandr.taskmanager"
version     = "0.1.0"
world       = "wandr:ui-shell/skiko-ui"
composition = "same-store"
orientation = "auto"
label       = "Task Manager"

[components]
ui = "components/ui.wasm"
