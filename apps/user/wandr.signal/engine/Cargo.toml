[package]
name = "signal-engine"
version = "0.1.0"
edition = "2021"
publish = false

# Task-67 Phase 2 item (1): the Signal engine as a wasm32-wasip2 reactor
# component exporting `wandr:signal/chat`. Refactors the proven signal-link CLI
# (link + receive + send + persist) onto the persistent wandr-step-executor so the
# background tasks survive across `chat.poll-events` calls. Reuses signal-link's
# store.rs / persist.rs verbatim.

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# Task 115 M3 — native CM-async (p3) is the DEFAULT Signal build: WASI 0.3
# streams via wandr-reqwest's backend, world signal-engine-p3 with the
# host-called `engine-start.start` export; wandr-step-executor is NOT in the
# build. `p2-legacy` (P2=1 ../build.sh, mutually exclusive: use
# --no-default-features) rebuilds the old reactor flavor — the only reason to
# is a device deploy before M4 flips the device host to p3-async.
[features]
default = ["p3-async"]
p3-async = ["wandr-reqwest/p3-async"]
p2-legacy = ["dep:wandr-step-executor", "wandr-reqwest/p2"]

[dependencies]
libsignal-service = { path = "../../../../external/libsignal-service-rs", default-features = false }
wandr-step-executor = { path = "../../../../crates/wandr-step-executor", optional = true }
# The executor seam (task::sleep/spawn) + the flavor-selected TLS backend the
# whole transport (incl. the libsignal fork) rides on. default-features = false:
# this crate's own features pick exactly one backend (see [features]).
wandr-reqwest = { path = "../../../../crates/wandr-reqwest", default-features = false }
# The call engine (Phase 2b-ii): Signal 1:1 voice calls. `signal` pulls the opaque
# codec + X25519-DH/GCM keying + the SignalCall driver.
wandr-call = { path = "../../../../crates/wandr-call", features = ["signal", "host-aead"] }
wit-bindgen = "0.59"
futures = "0.3"
rand = "0.9"
rand_chacha = "0.9"
getrandom = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"

# libsignal forces its constant-time curve25519 fork; consumers must replicate.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
