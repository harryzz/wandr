# Task 67 Phase 2 item 3 — the Signal app on device. A single skiko-ui component:
# signal-ui (dioxus-canvas conversation) WAC-plugged onto signal-engine (Signal
# protocol over the host wasi:tls transport), so the bundle has no [dependencies]
# (the engine is fused in). The host grants network + Signal CA (task 66) and a
# writable /state preopen (task 67) for the engine's account/history persistence.
app_id      = "wandr.signal"
version     = "0.1.0"
world       = "wandr:ui-shell/skiko-ui"
composition = "same-store"
orientation = "auto"
label       = "Signal"
# A chat UI doesn't need 60 fps; 30 halves animating cost (host-enforced).
max_fps     = 30
# M4 — a background-service: the host pumps `bg-tick` while we're backgrounded so
# the Signal socket stays live + messages arrive (with a notification) off-screen.
background  = true

[components]
ui = "components/ui.wasm"
