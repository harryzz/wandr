# wandr.jellyfin — task 119 Part A. A real Jellyfin streaming client that plays
# DirectPlay media through the shipped wandr:video + wasi:audio pipeline.
#
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/wandr_jellyfin.wasm components/ui.wasm
#
# A REACTOR (cdylib): the host drives us through frame-handler (render) and
# bg-tick (the async network+decode engine). No main loop of our own.
[package]
name    = "wandr-jellyfin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# p3-async is what gives us wasi:tls 0.3 async streams through reqwest — the same
# flavor wandr.signal and wandr.audio.player ship. There is no meaningful p2 path
# for this app, so p3-async is the only feature and the default.
default  = ["p3-async"]
# p3-async threads through to BOTH the HTTP client and the shared playback engine
# (their httprange fetch uses reqwest's p3 wasi:tls streams — cargo unifies them).
p3-async = ["reqwest/p3-async", "wandr-media-engine/p3-async"]

[dependencies]
wit-bindgen = "0.59"

# HTTPS over wasi:tls (auth + browse + PlaybackInfo + byte-range media). Same
# in-tree client Signal and audio.player use; renamed to `reqwest` so call sites
# read naturally. Trust is host-delegated (webpki public roots — Let's Encrypt
# included — so movies.zaharievi.eu is trusted without any host change).
reqwest = { path = "../../../crates/wandr-reqwest", package = "wandr-reqwest", default-features = false }

# The shared guest-side playback ENGINE (extracted from this app): container demux
# (mp4 + matroska-demuxer), guest-side audio decode (Symphonia/OxideAV/ropus), the
# A/V master clock + present(at-ns) sync, and the transport/scrub/subtitle overlay.
# It owns the video/audio/canvas IMPORTS bindgen; this app keeps only its EXPORTS.
wandr-media-engine = { path = "../../../crates/wandr-media-engine", default-features = false }

# JSON for the Jellyfin REST API; Url for reqwest.
serde_json = "1"
url        = "2"

[profile.release]
opt-level = "s"
lto       = true
strip     = true

# One-line fix for matroska-demuxer 0.8.0's CueRelativePosition seek bug:
# seek_broad_phase resolved CueRelativePosition against the FIRST cluster instead
# of the cue's own cluster → the reader landed mid-element → InvalidEbmlDataSize on
# every non-zero seek ("only Home works"). Fix (verified in repros/mkv-seek-probe):
# pass point.track_position.cluster_position to get_cluster_offset_and_timestamp.
# Vendored as a temporary bridge; promote to a GitHub fork (harryzz/matroska-demuxer)
# for upstreaming when convenient. Revisit oxideav-mkv once its open is streaming-lazy.
[patch.crates-io]
matroska-demuxer = { path = "../../../crates/wandr-media-engine/vendor/matroska-demuxer" }
