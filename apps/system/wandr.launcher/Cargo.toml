[package]
name    = "wandr-launcher"
version = "0.1.0"
edition = "2021"
publish = false

# Task 57 — dedicated launcher as a LIGHT Rust canvas guest (not
# Kotlin/Compose): exports my:skiko-gfx/renderer and draws the app grid
# directly via the canvas WIT. No Kotlin/Wasm runtime + no Compose →
# leak-immune (no withFrameNanos continuation retention) + tiny working
# set, which matters because the launcher is a persistent home process.
#
# wasm32-wasip2 target = native component (no wasm-tools embed/new +
# no reactor adapter; the host precompiles it like the other system
# components).
#   cargo build --target wasm32-wasip2 --release
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
