# Task 57 — the launcher is system chrome → system-apps/ (kind=system),
# so apps/ holds only genuine user apps and the launcher's own apps/-scan
# never lists it. The arbiter's set-home/launch path finds it via the
# loader's system-apps/ fallback (task 55).
app_id      = "war.launcher"
version     = "0.1.0"
world       = "my:skiko-gfx/skiko-ui"
kind        = "system"
composition = "same-store"
# Task 63 — the home screen stays portrait; while it's foreground the
# system chrome locks portrait too.
orientation = "locked"
label       = "Launcher"

[components]
ui = "components/ui.wasm"
