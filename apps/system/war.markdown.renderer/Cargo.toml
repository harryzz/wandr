[package]
name    = "markdown-renderer"
version = "0.1.0"
edition = "2021"
publish = false

# Component-model target (`wasm32-wasip2`) produces native components,
# so no `wasm-tools component embed`/`new` post-step is needed — the
# .wasm under target/wasm32-wasip2/release/ is already a component.
#
# Build:
#   cargo build --target wasm32-wasip2 --release
[lib]
crate-type = ["cdylib"]

[dependencies]
# Guest bindgen for the war:markdown@0.1.0 WIT contract.
wit-bindgen    = "0.46"
# CommonMark parser. Pure-Rust pull-parser, no JS-interop deps —
# comrak transitively pulls `slug` → `wasm-bindgen` which doesn't
# compile to wasm32-wasip2.
pulldown-cmark = { version = "0.13", default-features = false }
