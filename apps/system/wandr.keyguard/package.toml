# Keyguard/lockscreen system app. Installs under system-apps/ (kind=system) so the
# launcher's apps/-only scan doesn't list it; loaded via --standalone-overlay-lock.
app_id      = "wandr.keyguard"
version     = "0.1.0"
world       = "wandr:ui-shell/skiko-ui"
kind        = "system"
composition = "same-store"
orientation = "auto"
label       = "Lock Screen"

[components]
ui = "components/ui.wasm"
