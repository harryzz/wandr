# Task 55 — the status bar installs under system-apps/ (kind=system) so the
# launcher's apps/-only scan doesn't list it as a tile; the loader's
# AppRef::Installed search falls back to system-apps/ for the
# --standalone-overlay-top load.
app_id      = "wandr.statusbar"
version     = "0.1.0"
world       = "wandr:ui-shell/statusbar"
kind        = "system"
composition = "same-store"
orientation = "auto"
label       = "Status Bar"

[components]
ui = "components/ui.wasm"
