# Task 56 — the taskbar installs under system-apps/ (kind=system), same as
# the status bar: launched directly as a thin always-visible bottom-nav
# overlay (`--standalone-overlay-bottom-bar`), so the launcher's apps/-only
# scan never lists it.
app_id      = "wandr.taskbar"
version     = "0.1.0"
world       = "wandr:ui-shell/taskbar"
kind        = "system"
composition = "same-store"
orientation = "auto"
label       = "Taskbar"

[components]
ui = "components/ui.wasm"
