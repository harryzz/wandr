# wandr-media-engine — the shared guest-side playback ENGINE for task 119.
#
# Extracted verbatim from wandr.jellyfin (the first consumer): container demux
# (MP4 sample-table + MKV/Matroska), guest-side audio decode (AAC/MP3/Opus/AC-3),
# the A/V master clock + present(at-ns) sync, the wandr:video decode-feed, and the
# on-screen transport/scrub/subtitle overlay. It owns an IMPORTS-ONLY
# `wit_bindgen::generate!` (video + audio + canvas) so it composes with each
# consumer app's own EXPORTS `generate!` in the same cdylib (no cabi_realloc
# clash — same trick wandr-reqwest uses). A thin app (wandr.jellyfin source layer,
# wandr.dash source layer) depends only on this crate + wandr-reqwest.
#
# rlib (no crate-type): statically linked into the consumer's wasm32-wasip2 cdylib.
[package]
name    = "wandr-media-engine"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Mirror the consumer's p3-async: httprange fetches media over reqwest's p3
# wasi:tls async streams. Cargo unifies this with the app's own p3-async feature.
default  = ["p3-async", "video"]
p3-async = ["reqwest/p3-async"]
# The video playback lane (wandr:video decode-feed + present + compositing + the
# subtitle overlay). ON by default; an AUDIO-ONLY consumer (a music client) builds with
# `default-features = false` to compile none of it — no VideoDecoder opened, smaller
# binary. The wandr:video WIT import stays declared for now (host-satisfied, unused);
# dropping it is deferred to the wasi:media proposal extraction. See task 120.
video    = []

[dependencies]
# Owns the imports-only generate! (video/audio/canvas) + re-exports __wit_bindgen.
wit-bindgen = "0.59"

# HTTPS byte-range media fetch over wasi:tls — the same in-tree client the app
# uses for its API calls (cargo unifies to one version/feature set).
reqwest = { path = "../wandr-reqwest", package = "wandr-reqwest", default-features = false }

# MKV/WebM demux — a VENDORED wandr fork of oxideav-mkv (upstream git rev 79faa268,
# the July-17 SeekHead→post-cluster-Cues jump) plus a one-function addition:
# `demux::open_streaming`, which skips the open-time late-Cues *scan* fallback.
# Upstream `open` walks every Cluster header to segment-end when the Cues index is
# neither front-stored nor SeekHead-reachable — over an HTTP-Range reader that is one
# range request per Cluster across the whole movie (a "fetch storm" on open of a
# cue-less remux, e.g. some Jellyfin MKVs). `open_streaming` accepts an empty index
# instead; seek on a genuinely cue-less file then reports Unsupported (no storm).
# Promote to a pushed harryzz/oxideav-mkv fork + upstream PR when convenient.
# See [[reference_jellyfin_container_demux_and_mkv_seek]].
oxideav-mkv = { path = "vendor/oxideav-mkv" }

# MP4/MOV demux — oxideav-mp4, the SOLE MP4 demuxer (retired the `mp4` 0.14 crate):
#   * progressive MP4/MOV (Demux::Ox): open() parses moov sample tables and skips
#     mdat via seek (HTTP-Range-friendly random access), next_packet/seek_to serve
#     samples — replaces mp4-crate read_sample + our hand-rolled stts/edit-list code.
#   * fragmented MP4 / CMAF (Demux::Fmp4): the `mp4` crate's read_sample() was BROKEN
#     for fragments (constant sample offset), which is why we moved here first.
# PINNED to a GIT rev (not crates.io 0.0.9, 2 months stale): the 2026-07-17 commits
# add FULL §8.6.6 edit-list timeline mapping on demux (empty-edit start delay + trim +
# dwell + multi-segment; packet PTS carries the mapped presentation time) — so the
# engine no longer needs a bespoke edit_offset_us. Empty-edit A/V-sync now upstream.
oxideav-mp4       = { git = "https://github.com/OxideAV/oxideav-mp4", rev = "e9e8b579335a1e6ee8bb26163cccdf086923da4a" }
oxideav-container = "0.1"

# Media-URL parsing for the byte-range fetch (net module).
url = "2"

# Guest-side audio decode -> interleaved f32 PCM. Symphonia (AAC/MP3/isomp4);
# OxideAV (AC-3/E-AC-3, pure-Rust, has a 5.1->stereo downmix); ropus (Opus).
# Audio decode (all guest-side). mp3/aac/isomp4 = the container-demuxed lanes;
# flac/vorbis/ogg/wav = the symphonia-NATIVE audio source (Demux::Audio) for raw music
# files streamed by a Subsonic/Navidrome server. All royalty-free.
symphonia    = { version = "0.6.0", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav"] }
oxideav-core = "0.1"
oxideav-ac3  = "=0.0.10"
ropus        = "0.12"

[profile.release]
opt-level = "s"
lto       = true
strip     = true
