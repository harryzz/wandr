# audioclient-rs — Rust client for Android's native AudioFlinger (libaudioclient).
# Talks to AudioFlinger over binder (IAudioFlingerService.createTrack/createRecord →
# IAudioTrack/IAudioRecord) and drives the shared audio_track_cblk_t ring directly.
# No AAudioService, no JVM. Plan of record: wart `tasks/98-wart-audio-audioflinger-backend.md`.
[package]
name        = "audioclient-rs"
version     = "0.0.1"
edition     = "2021"
description = "Rust client for Android's native AudioFlinger (libaudioclient): AudioTrack/AudioRecord over binder, no AAudioService, no JVM."
repository  = "https://codeberg.org/harryzz/wart"
# license   = "..."   # TODO set before any crates.io publish
publish     = false    # platform-ABI crate (version-pinned); flip when ready to publish

# Standalone (own workspace), like the sibling wart-hal-* crates.
[workspace]

[lib]
name = "audioclient"   # consumers: `use audioclient::…`
path = "src/lib.rs"

[dependencies]
log = "0.4"

# Android-only: the binder runtime. Off-android the crate is no-op stubs (so
# dependents compile cross-platform). rsbinder pinned to the project's git rev.
[target.'cfg(target_os = "android")'.dependencies]
rsbinder    = { git = "https://github.com/hiking90/rsbinder", rev = "5e999e04a", features = ["android_11_plus"] }
async-trait = "0.1"
tokio       = { version = "1", features = ["rt"] }

[build-dependencies]
rsbinder-aidl = { git = "https://github.com/hiking90/rsbinder", rev = "5e999e04a" }
