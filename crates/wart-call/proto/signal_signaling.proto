// Reference contract (NOT compiled) for the Signal 1:1 call `opaque` blob.
//
// This is our own minimal reimplementation of the wire format ringrtc carries in
// the `opaque` bytes of Signal's `CallMessage.{Offer,Answer,IceUpdate}` (see
// external/libsignal-service-rs/protobuf/SignalService.proto). The field numbers
// and types ARE the on-wire contract and must match ringrtc exactly; the file
// itself is authored from the spec, not copied (ringrtc is AGPL-3.0).
//
// The codec in src/signal/mod.rs hand-derives these as `prost::Message` structs
// (no protoc / build.rs), so this `.proto` is documentation only — it is the
// declarative source of truth for the tags the Rust attributes mirror.
//
// Headline: Signal's V4 1:1 protocol does NOT use DTLS-SRTP. `ConnectionParametersV4`
// carries an X25519 `public_key`; SRTP keys are derived via Diffie-Hellman + HKDF
// (AEAD AES-256-GCM), not a DTLS handshake. Media params (Opus PT, rtcp-mux,
// header extensions) are NOT on the wire — both ends synthesize identical local SDP.

syntax = "proto2";
package wart.signal;

// `opaque` of CallMessage.Offer
message Offer  { optional ConnectionParametersV4 v4 = 4; }

// `opaque` of CallMessage.Answer
message Answer { optional ConnectionParametersV4 v4 = 4; }

// `opaque` of one CallMessage.IceUpdate (ringrtc trickles several, one blob each)
message IceCandidate   { optional IceCandidateV3 added_v3 = 2; }  // field 2 for V2/V3 compat
message IceCandidateV3 { optional string sdp = 1; }               // full SDP line incl. "candidate:" prefix

message ConnectionParametersV4 {
  optional bytes  public_key      = 1;  // X25519 public key (32 bytes)
  optional string ice_ufrag       = 2;
  optional string ice_pwd         = 3;
  // field 4 = repeated receive_video_codecs — omitted (audio-only v1)
  optional uint64 max_bitrate_bps = 5;
}
