[package]
name = "wandr-reqwest"
version = "0.1.0"
edition = "2021"
publish = false

# A drop-in `reqwest`: real reqwest on native (passthrough), a wasi:tls subset on
# wasm32 (see src/lib.rs + README.md). Shared guest-side lib: the libsignal fork
# consumes it as its `reqwest` dependency (package rename) for the Signal guest,
# and wandr.audio.player uses it for internet metadata/cover-art lookups.

[lib]
path = "src/lib.rs"

# native: passthrough to the real reqwest (features it needs hardcoded here).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-manual-roots", "stream"] }

# Task 115 — select the transport backend; exactly ONE of:
#   `p2` (default)  — wasi:tls@0.2 driven by the wandr-step-executor reactor
#                     (legacy; remaining consumers: wandr.audio.player,
#                     repros/signal-link [stale, scheduled for deletion])
#   `p3-async`      — WASI 0.3 native CM-async streams (src/tls_p3.rs), zero
#                     step-executor anywhere (the Signal build since M3;
#                     consumers set default-features = false)
# Same public API either way (the `tls` module name is #[path]-switched), so
# http1/api/websocket consumers compile unchanged. See tasks/115.
[features]
default = ["p2"]
# `wasip2` (wit-bindgen 0.57.1 transitively) is only used by the p2 tls.rs
# pollable bridge — gate it to p2 so a p3 build resolves ONE wit-bindgen (0.59).
p2 = ["dep:wandr-step-executor", "dep:wasip2"]
p3-async = []

# wasm32: the wasi:tls implementation.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wandr-step-executor = { path = "../wandr-step-executor", optional = true }
wasip2 = { version = "1", optional = true }
wit-bindgen = { version = "0.59", features = ["async", "async-spawn"] }
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"
url = "2"

[profile.release]
opt-level = "s"
