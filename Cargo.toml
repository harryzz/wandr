[package]
name    = "system-fonts"
version = "0.1.0"
edition = "2021"
publish = false

# Third cross-app dep system component (task 41). Lists/reads fonts
# from /system-fonts/ — wart-host preopens /system/fonts/ at that
# guest-visible path. Standard WASI fs from the dep's side via std::fs.
#
# Build:
#   cargo build --target wasm32-wasip2 --release

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
