[package]
name    = "wart-arbiter-notify"
version = "0.0.1"
edition = "2021"

# wart-arbiter-notify — the notification module (Signal bg-receipt M3). Owns the
# active user-notification list in the core Store: post/cancel (forwarded from
# the war:notify/notifier host import), list (for the status-bar feed), and click
# (foreground the owner + deliver on-notification-click). Wired in with one line.

[dependencies]
wart-arbiter-core = { path = "../wart-arbiter-core" }
log = { workspace = true }
