# wart-screen — tiny `wart-screen on|off` binary that toggles panel power via the
# shared wart-hal-display ISurfaceComposer::setPowerMode path (task 81). It exists
# as a SEPARATE process so the arbiter can run it through `wart-launch` (task 83) —
# i.e. as uid system + gid graphics — which is required for the SurfaceFlinger
# ACCESS_SURFACE_FLINGER check to short-circuit with ART off (bare root HANGS on the
# now-dead permission service). Member of the wart-arbiter workspace so it inherits
# the aarch64-linux-android target + NDK linker from ../.cargo/config.toml.
[package]
name    = "wart-screen"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "wart-screen"
path = "src/main.rs"

[dependencies]
wart-hal-display = { path = "../../wart-hal-display" }
