[package]
name = "wart-activityms"
version = "0.0.1"
edition = "2021"
publish = false

# wart-activityms — a minimal stub `activity` (IActivityManager) binder service for
# ART-off operation. Under --no-art audioserver/cameraserver block forever on
# waitForService("activity") (ActivityManager lived in the now-dead system_server),
# which wedges them and drops media.audio_flinger/policy/aaudio → no audio. This
# permissive stub registers "activity" and answers the handful of IActivityManager
# methods they call (registerUidObserver no-op, everything foreground/granted) so
# they finish init. Pure Rust via rsbinder + rsbinder-aidl codegen of a minimal
# IActivityManager.aidl (no C++/a-03). See [[project-artless-audio]].

[[bin]]
name = "wart-activityms"
path = "src/main.rs"

[dependencies]
rsbinder = { git = "https://github.com/hiking90/rsbinder", rev = "5e999e04a", features = ["android_11_plus"] }
# rsbinder-aidl always emits an async service trait (#[::async_trait::async_trait] +
# rsbinder::BoxFuture); these must be present for the generated code to compile even
# though we implement the SYNC IActivityManager trait. Mirrors wart-hal-display.
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
rsbinder-aidl = { git = "https://github.com/hiking90/rsbinder", rev = "5e999e04a" }
