[package]
name    = "wandr-arbiter-notify"
version = "0.0.1"
edition = "2021"

# wandr-arbiter-notify — the notification module (Signal bg-receipt M3). Owns the
# active user-notification list in the core Store: post/cancel (forwarded from
# the wandr:notify/notifier host import), list (for the status-bar feed), and click
# (foreground the owner + deliver on-notification-click). Wired in with one line.

[dependencies]
wandr-arbiter-core = { path = "../wandr-arbiter-core" }
log = { workspace = true }
