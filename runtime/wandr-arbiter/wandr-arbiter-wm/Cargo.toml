[package]
name    = "wandr-arbiter-wm"
version = "0.0.1"
edition = "2021"

# wandr-arbiter-wm — the WindowManager module (task 73), the first real
# responsibility crate. Absorbs the WMS geometry policy that was
# duplicated in the per-app host: chrome insets, keyboard occlusion, and
# orientation → computed display/content/safe rects, pushed to hosts as
# data. The host keeps the skia matrix (render mechanism); the arbiter
# decides. Wired into the binary's registry with one line.

[dependencies]
wandr-arbiter-core = { path = "../wandr-arbiter-core" }
anyhow = { workspace = true }
log    = { workspace = true }
