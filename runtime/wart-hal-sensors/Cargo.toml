[package]
name    = "wart-hal-sensors"
version = "0.0.1"
edition = "2021"

# wart-hal-sensors — shared sensor HAL access (task 77). The ONE binder-touching
# crate for the `android.frameworks.sensorservice.ISensorManager` path
# (enumerate / enable / disable / poll), used by BOTH the wart-host guest-facing
# sensors WIT impl and the arbiter's sensor-driver thread. Exposes neutral
# structs (no WIT / no arbiter-core types) so each consumer maps to its own
# vocabulary. The AIDL is vendored under wart-host/vendor and codegen'd in
# build.rs (android only); off-android the API is no-op stubs.
#
# Standalone package (own [workspace] table) so it can be path-depended from both
# the wart-host package and the separate wart-arbiter virtual workspace without
# being auto-absorbed into either.

[workspace]

[dependencies]
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# Match wart-host's pin exactly (the shared binder ABI / decode fixes — see
# [[reference_rsbinder_version]]).
rsbinder    = { git = "https://github.com/hiking90/rsbinder", rev = "5e999e04a", features = ["android_11_plus"] }
async-trait = "0.1"
# Current-thread runtime needed by BnEventQueueCallback::new_async_binder.
tokio       = { version = "1", features = ["rt"] }

[build-dependencies]
rsbinder-aidl = { git = "https://github.com/hiking90/rsbinder", rev = "5e999e04a" }
